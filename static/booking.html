<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="booking-page">
<!-- Navbar -->
<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="navbar-title">台北一日遊</a>
    <div class="navbar-actions">
      <button class="navbar-btn" id="bookingTrigger">預定行程</button>
      <button class="navbar-btn" id="authTrigger"></button>
    </div>
  </div>
</nav>
<!-- 主內容區塊 -->
<main class="booking-main">
    <!-- Headline -->
  <div class="booking-headline">
    <p class="headline-text">您好，<span class="headline-name" id="headlineName"></span>，待預訂的行程如下：</p>
  </div>
<div id="bookingContent" style="display:none">
  <!-- section -->
  <div class="booking-section">
    <button class="icon-delete" type="button" aria-label="刪除" id="deleteBtn">
      <img src="/static/icon_delete.png" alt="">
    </button>

    <div class="booking-picture">
      <img alt="" class="booking-img" id="bookingImg">
    </div>

    <div class="booking-infor">
      <p class="booking-title" id="bookingTitle"></p>

      <p class="booking-row">
        <span class="row-label">日期：</span>
        <span class="row-value" id="bookingDate"></span>
      </p>
      <p class="booking-row">
        <span class="row-label">時間：</span>
        <span class="row-value" id="bookingTime"></span>
      </p>
      <p class="booking-row">
        <span class="row-label">費用：</span>
        <span class="row-value" id="bookingPrice"></span>
      </p>
      <p class="booking-row">
        <span class="row-label">地點：</span>
        <span class="row-value" id="bookingAddress"></span>
      </p>
    </div>   
  </div>
  <hr class="separator-main separator-tight">
  <!-- contact -->
  <div class="form-section">
    <p class="form-title">您的聯絡資訊</p>
    <div class="form-fields">
      <div class="form-field">
        <span class="form-label">聯絡姓名：</span>
        <input type="text" class="form-input" id="contactName">
      </div>
      <div class="form-field">
        <span class="form-label">連絡信箱：</span>
        <input type="email" class="form-input" id="contactEmail">
      </div>
      <div class="form-field">
        <span class="form-label">手機號碼：</span>
        <input type="tel" class="form-input" id="contactPhone">
      </div>
      <p class="form-notice">請保持手機暢通，準時到達，導覽人員將用手機與您聯繫，務必留下正確的聯絡方式。</p>
    </div>
  </div>

  <hr class="separator-main">
  <!-- payment -->
  <div class="form-section">
    <p class="form-title">信用卡付款資訊</p>
    <div class="form-fields">
      <div class="form-field">
        <span class="form-label">卡片號碼：</span>
        <div class="form-input" id="cardNumber"></div>
      </div>
      <div class="form-field">
        <span class="form-label">過期時間：</span>
        <div class="form-input" id="cardExpiry"></div>
      </div>
      <div class="form-field">
        <span class="form-label">驗證密碼：</span>
        <div class="form-input" id="cardCvv"></div>
      </div>
    </div>
  </div>
  <hr class="separator-main">
  <!-- confirm -->
  <div class="confirm-section">
    <p class="confirm-total" id="confirmTotal"></p>
    <button type="button" class="confirm-btn" id="confirmBtn" disabled>確認訂購並付款</button>
  </div>
</div>
<p class="booking-empty" id="bookingEmpty" style="display:none">目前沒有任何待預訂的行程</p>
</main>
<!-- footer -->
<footer class="footer">
<div class="footer-inner">
  <p class="footer-text">COPYRIGHT © 2021 台北一日遊</p>
</div>  
</footer>
  <!-- 登入/註冊彈窗 -->
<div class="dialog-overlay" id="dialogOverlay">
  <div class="dialog-signin" id="dialogSignin">
    <div class="decorator-bar"></div>
    <button class="icon-close" id="dialogClose" type="button" aria-label="關閉">
      <img src="/static/icon_close.png" alt="">
    </button>
    <!-- 登入表單 -->
    <div class="dialog-main" id="signinForm" >
      <h2 class="dialog-title">登入會員帳號</h2>
      <div class="dialog-container">
        <input type="email" class="dialog-input" id="signinEmail" placeholder="輸入電子信箱">
        <input type="password" class="dialog-input" id="signinPassword" placeholder="輸入密碼">
        <button class="dialog-btn" id="signinBtn" type="button">登入帳戶</button>
        <p class="dialog-switch" id="switchToSignup">還沒有帳戶？點此註冊</p>
        <p class="dialog-error" id="signinError"></p>
      </div>
    </div>
    <!-- 註冊表單，預設藏起來 -->
    <div class="dialog-main" id="signupForm" style="display:none;">
      <h2 class="dialog-title">註冊會員帳號</h2>
      <div class="dialog-container">
        <input type="text" class="dialog-input" id="signupName" placeholder="輸入姓名">
        <input type="email" class="dialog-input" id="signupEmail" placeholder="輸入電子郵件">
        <input type="password" class="dialog-input" id="signupPassword" placeholder="輸入密碼">
        <button class="dialog-btn" id="signupBtn" type="button">註冊新帳戶</button>
        <p class="dialog-error" id="signupError"></p>
        <p class="dialog-switch" id="switchToSignin">已經有帳戶了？點此登入</p>
      </div>
    </div>
  </div>
</div>
<script src="https://js.tappaysdk.com/sdk/tpdirect/v5.14.0"></script>
<script src="/static/auth.js"></script>
<script src="/static/booking.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attraction</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-title">台北一日遊</a>
      <div class="navbar-actions">
        <button class="navbar-btn">預定行程</button>
        <button class="navbar-btn" id="authTrigger"></button>
      </div>
    </div>
  </nav>
  <!-- Section -->
  <section class="attraction-main">
    <!-- picture current -->
    <div class="picture-current">
      <img class="current-img" id="currentImg" src="" alt="">
      <button class="picture-arrow-left" id="prevBtn" type="button" aria-label="上一張">
        <img src="/static/left-arrow.png" alt="">
      </button>
      <button class="picture-arrow-right" id="nextBtn" type="button" aria-label="下一張">
        <img src="/static/right-arrow.png" alt="">
      </button>
      <!-- indicator bar -->
      <div class="indicator-bar" id="indicatorBar">

      </div>

    </div>
    <!-- profile -->
    <div class="attraction-profile">
      <h1 class="profile-title" id="profileTitle"></h1>
      <p class="profile-subtitle" id="profileSubtitle"></p>
      <!-- booking form -->
      <div class="booking-form">
          <h2 class="booking-title">訂購導覽行程</h2>
          <p class="booking-desc">以此景點為中心的一日行程，帶您探索城市角落故事</p>
          <div class="field-date">
            <span class="field-label">選擇日期：</span>
            <input type="date" class="date-input" >
          </div>
          <div class="field-time">
              <span class="field-label">選擇時間：</span>
              <label class="radio-option">
                <input type="radio" name="timeSlot" value="morning" checked>
                <span>上半天</span>
              </label>
              <label class="radio-option">
                <input type="radio" name="timeSlot" value="afternoon">
                <span>下半天</span>
              </label>
          </div>
          <div class="field-price">
            <span class="field-label">導覽費用：</span>
            <span class="price-value" id="priceValue">新台幣 2000 元</span>
          </div>
          <button class="btn-booking" type="button">開始預約行程</button>
      </div>
    </div>
  </section>
  <hr class="separator-main">
  <!-- infors -->
  <div class="infors">
    <p class="attraction-desc" id="attractionDesc"></p>

    <div class="info-group">
      <h3 class="info-label">景點地址：</h3>
      <p class="info-value" id="infoAddress"></p>
    </div>

    <div class="info-group">
      <h3 class="info-label">交通方式：</h3>
      <p class="info-value" id="infoTransport">捷運站名：...</p>
    </div>
  </div>
  <footer class="footer">
  <div class="footer-inner">
    <p class="footer-text">COPYRIGHT © 2021 台北一日遊</p>
  </div>  
  </footer>
  <!-- 登入/註冊彈窗 -->
<div class="dialog-overlay" id="dialogOverlay">
  <div class="dialog-signin" id="dialogSignin">
    <div class="decorator-bar"></div>
    <button class="icon-close" id="dialogClose" type="button" aria-label="關閉">
      <img src="/static/icon_close.png" alt="">
    </button>
    <!-- 登入表單 -->
    <div class="dialog-main" id="signinForm" >
      <h2 class="dialog-title">登入會員帳號</h2>
      <div class="dialog-container">
        <input type="email" class="dialog-input" id="signinEmail" placeholder="輸入電子信箱">
        <input type="password" class="dialog-input" id="signinPassword" placeholder="輸入密碼">
        <button class="dialog-btn" id="signinBtn" type="button">登入帳戶</button>
        <p class="dialog-switch" id="switchToSignup">還沒有帳戶？點此註冊</p>
        <p class="dialog-error" id="signinError"></p>
      </div>
    </div>
    <!-- 註冊表單，預設藏起來 -->
    <div class="dialog-main" id="signupForm" style="display:none;">
      <h2 class="dialog-title">註冊會員帳號</h2>
      <div class="dialog-container">
        <input type="text" class="dialog-input" id="signupName" placeholder="輸入姓名">
        <input type="email" class="dialog-input" id="signupEmail" placeholder="輸入電子郵件">
        <input type="password" class="dialog-input" id="signupPassword" placeholder="輸入密碼">
        <button class="dialog-btn" id="signupBtn" type="button">註冊新帳戶</button>
        <p class="dialog-error" id="signupError"></p>
        <p class="dialog-switch" id="switchToSignin">已經有帳戶了？點此登入</p>
      </div>
    </div>
  </div>
</div>
  <script src="/static/attraction.js"></script>
  <script src="/static/auth.js"></script>
</body>
</html>

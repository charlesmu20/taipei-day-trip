<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>會員中心 | 台北一日遊</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="member-page">
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-title">台北一日遊</a>
      <div class="navbar-actions">
        <button class="navbar-btn" id="bookingTrigger">預定行程</button>
        <button class="navbar-btn" id="authTrigger"></button>
      </div>
    </div>
  </nav>

  <section class="member-section">
    <!-- Headline -->
    <div class="booking-headline">
        <p class="headline-text">您好，<span class="headline-name" id="headlineName"></span></p>
    </div>
    <hr class="separator-main separator-tight">  

    <div class="mcp-block">
        <p class="mcp-title">AI 工具整合</p>
        <p class="mcp-subtitle">MCP 伺服器設定：</p>
        <ul class="mcp-info-list">
            <li>
            <span class="mcp-info-label">Host URL</span>
            <span class="mcp-info-value" id="hostUrl"></span>
            </li>
            <li>
            <span class="mcp-info-label">Bearer Token</span>
            <span class="mcp-info-value" id="tokenValue"></span>
            </li>
        </ul>
        <button class="token-generate-btn" id="generateBtn">產生 / 更新金鑰</button>
    </div>

    <hr class="separator-main separator-tight">

    <div class="logout-row">
      <button class="logout-btn" id="logoutBtn">登出會員</button>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-text">COPYRIGHT © 2026 台北一日遊</p>
    </div>
  </footer>
<!-- 登入/註冊彈窗 -->
<div class="dialog-overlay" id="dialogOverlay">
<div class="dialog-signin" id="dialogSignin">
    <div class="decorator-bar"></div>
    <button class="icon-close" id="dialogClose" type="button" aria-label="關閉">
    <img src="/static/icon_close.png" alt="">
    </button>
    <!-- 登入表單 -->
    <div class="dialog-main" id="signinForm" >
    <h2 class="dialog-title">登入會員帳號</h2>
    <div class="dialog-container">
        <input type="email" class="dialog-input" id="signinEmail" placeholder="輸入電子信箱">
        <input type="password" class="dialog-input" id="signinPassword" placeholder="輸入密碼">
        <button class="dialog-btn" id="signinBtn" type="button">登入帳戶</button>
        <p class="dialog-switch" id="switchToSignup">還沒有帳戶？點此註冊</p>
        <p class="dialog-error" id="signinError"></p>
    </div>
    </div>
    <!-- 註冊表單，預設藏起來 -->
    <div class="dialog-main" id="signupForm" style="display:none;">
    <h2 class="dialog-title">註冊會員帳號</h2>
    <div class="dialog-container">
        <input type="text" class="dialog-input" id="signupName" placeholder="輸入姓名">
        <input type="email" class="dialog-input" id="signupEmail" placeholder="輸入電子郵件">
        <input type="password" class="dialog-input" id="signupPassword" placeholder="輸入密碼">
        <button class="dialog-btn" id="signupBtn" type="button">註冊新帳戶</button>
        <p class="dialog-error" id="signupError"></p>
        <p class="dialog-switch" id="switchToSignin">已經有帳戶了？點此登入</p>
    </div>
    </div>
</div>
</div>

<script src="/static/auth.js"></script>
<script src="/static/member.js"></script>

</body>
</html>
